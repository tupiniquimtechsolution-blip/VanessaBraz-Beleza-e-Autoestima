name: Import Google Drive media

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-drive-media.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-vanessa-drive-media
  cancel-in-progress: false

jobs:
  import-media:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DRIVE_FOLDER_URL: https://drive.google.com/drive/folders/16dGWA3s7DInFaQQ1y76Sij8SWNpfEbMI?usp=sharing
      MEDIA_ROOT: apps/web/public/media/source

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned downloader
        run: python -m pip install --disable-pip-version-check gdown==6.2.0

      - name: Resolve Google Drive inventory
        run: |
          set -euo pipefail
          python -m gdown "$DRIVE_FOLDER_URL" --folder --json --quiet > _drive_listing.json
          python - <<'PY'
          import json
          from pathlib import Path
          entries = json.loads(Path('_drive_listing.json').read_text(encoding='utf-8'))
          if not entries:
              raise SystemExit('Google Drive folder inventory is empty.')
          print(f'Google Drive inventory: {len(entries)} files')
          PY

      - name: Download shared Google Drive folder
        run: |
          set -uo pipefail
          rm -rf _drive_import
          mkdir -p _drive_import
          set +e
          python -m gdown "$DRIVE_FOLDER_URL" --folder -O _drive_import
          GDOWN_STATUS=$?
          set -e
          echo "gdown exit status: ${GDOWN_STATUS}"
          echo "The workflow will continue so partial/transient failures can be inventoried and retried individually."
          exit 0

      - name: Retry files missing from folder download
        run: |
          python <<'PY'
          from __future__ import annotations

          import json
          import subprocess
          import time
          from pathlib import Path, PurePosixPath

          listing = json.loads(Path('_drive_listing.json').read_text(encoding='utf-8'))
          destination_root = Path('_drive_import')
          failures: list[dict[str, str]] = []

          def safe_relative_path(raw: str) -> Path:
              posix = PurePosixPath(raw)
              if posix.is_absolute() or '..' in posix.parts:
                  raise ValueError(f'Unsafe Drive path: {raw!r}')
              return Path(*posix.parts)

          def exists_nonempty(path: Path) -> bool:
              return path.is_file() and path.stat().st_size > 0

          for index, entry in enumerate(listing, start=1):
              url = entry['url']
              relative = safe_relative_path(entry['path'])
              target = destination_root / relative
              if exists_nonempty(target):
                  continue

              target.parent.mkdir(parents=True, exist_ok=True)
              last_error = ''
              for attempt in range(1, 5):
                  print(f'Retrying [{index}/{len(listing)}] {relative} (attempt {attempt}/4)')
                  proc = subprocess.run(
                      ['python', '-m', 'gdown', url, '-O', str(target), '--quiet'],
                      text=True,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                  )
                  if proc.returncode == 0 and exists_nonempty(target):
                      last_error = ''
                      break
                  last_error = (proc.stdout or '').strip()[-1500:]
                  target.unlink(missing_ok=True)
                  time.sleep(4 * attempt)

              if last_error or not exists_nonempty(target):
                  failures.append({
                      'path': relative.as_posix(),
                      'url': url,
                      'error': last_error or 'download did not create a non-empty file',
                  })

          Path('_drive_failures.json').write_text(
              json.dumps(failures, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(f'Individual retry failures remaining: {len(failures)}')
          PY

      - name: Organize media and generate manifest
        run: |
          python <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import mimetypes
          import shutil
          from datetime import datetime, timezone
          from pathlib import Path

          source = Path('_drive_import')
          root = Path('apps/web/public/media/source')
          images = root / 'images'
          videos = root / 'videos'
          other = root / 'other'

          listing = json.loads(Path('_drive_listing.json').read_text(encoding='utf-8'))
          failures = json.loads(Path('_drive_failures.json').read_text(encoding='utf-8'))

          if root.exists():
              shutil.rmtree(root)
          for directory in (images, videos, other):
              directory.mkdir(parents=True, exist_ok=True)

          def unique_destination(directory: Path, name: str) -> Path:
              target = directory / name
              if not target.exists():
                  return target
              stem = target.stem
              suffix = target.suffix
              index = 2
              while True:
                  candidate = directory / f'{stem}-{index}{suffix}'
                  if not candidate.exists():
                      return candidate
                  index += 1

          entries = []
          for path in sorted(p for p in source.rglob('*') if p.is_file()):
              mime, _ = mimetypes.guess_type(path.name)
              mime = mime or 'application/octet-stream'
              if mime.startswith('image/'):
                  category = 'image'
                  destination_dir = images
              elif mime.startswith('video/'):
                  category = 'video'
                  destination_dir = videos
              else:
                  category = 'other'
                  destination_dir = other

              destination = unique_destination(destination_dir, path.name)
              shutil.copy2(path, destination)
              digest = hashlib.sha256(destination.read_bytes()).hexdigest()
              entries.append({
                  'original_name': path.name,
                  'repository_path': destination.as_posix(),
                  'category': category,
                  'mime_type': mime,
                  'size_bytes': destination.stat().st_size,
                  'sha256': digest,
              })

          if not entries:
              raise SystemExit('No media files were downloaded from Google Drive.')

          manifest = {
              'source': 'Google Drive public folder',
              'source_url': 'https://drive.google.com/drive/folders/16dGWA3s7DInFaQQ1y76Sij8SWNpfEbMI?usp=sharing',
              'imported_at_utc': datetime.now(timezone.utc).isoformat(),
              'expected_files': len(listing),
              'downloaded_files': len(entries),
              'failed_files': len(failures),
              'images': sum(e['category'] == 'image' for e in entries),
              'videos': sum(e['category'] == 'video' for e in entries),
              'other': sum(e['category'] == 'other' for e in entries),
              'failures': failures,
              'files': entries,
          }

          (root / 'media-manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          (root / 'README.md').write_text(
              '# Vanessa Braz — Source Media\n\n'
              'Arquivos importados automaticamente da pasta pública do Google Drive fornecida para o projeto.\n\n'
              '- `images/`: imagens originais importadas.\n'
              '- `videos/`: vídeos originais importados.\n'
              '- `other/`: outros formatos, se existirem.\n'
              '- `media-manifest.json`: inventário com nome, caminho, MIME, tamanho, SHA-256 e eventuais falhas.\n\n'
              'Os nomes originais são preservados para rastreabilidade. A aplicação pode gerar posteriormente versões WebP/AVIF e nomes semânticos sem destruir os originais.\n',
              encoding='utf-8',
          )

          print(
              f"Expected {manifest['expected_files']}; imported {manifest['downloaded_files']} "
              f"({manifest['images']} images, {manifest['videos']} videos, {manifest['other']} other); "
              f"failures: {manifest['failed_files']}"
          )
          PY

      - name: Commit imported media
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MEDIA_ROOT"
          if git diff --cached --quiet; then
            echo "No media changes to commit."
            exit 0
          fi
          git commit -m "assets(media): import Vanessa Braz media from Google Drive"
          git push origin HEAD:main

      - name: Verify complete transfer
        run: |
          python <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('apps/web/public/media/source/media-manifest.json').read_text(encoding='utf-8'))
          if manifest['failed_files']:
              print('WARNING: Some Google Drive files still failed after retries:')
              for item in manifest['failures']:
                  print(f"- {item['path']}")
              raise SystemExit(2)
          if manifest['downloaded_files'] != manifest['expected_files']:
              raise SystemExit(
                  f"Transfer count mismatch: expected {manifest['expected_files']}, "
                  f"downloaded {manifest['downloaded_files']}"
              )
          print(f"Complete transfer verified: {manifest['downloaded_files']} files.")
          PY
